name: "🐞 BugFix"
description: 예상과 다른 동작, 오류, 예외 상황을 보고합니다.
title: "[BUG] "
labels: ["🐞 BugFix"]

body:
  - type: dropdown
    id: fr_id
    attributes:
      label: "관련 상위 FR ID"
      options:
        - "FR-001 공통 헤더 및 알림"
        - "FR-002 인증/로그인"
        - "FR-003 메인 대시보드"
        - "FR-004 병목 모니터링"
        - "FR-005 MES 실시간 모니터링"
        - "FR-006 장비 모니터링"
        - "FR-007 3D FAB 뷰"
        - "FR-008 병목 감지"
        - "FR-009 원인 분석"
        - "FR-010 대응안 비교/HITL"
        - "FR-011 리포트 생성"
        - "FR-012 대응 이력"
        - "FR-013 AI 챗봇"
        - "FR-014 임계값 관리"
        - "FR-015 MLflow 모니터링"
        - "FR-016 권한 관리"
        - "FR-017 MES 인터페이스 관리"
        - "FR-018 프롬프트 관리"
    validations:
      required: false

  - type: textarea
    id: bug_reproduction
    attributes:
      label: "버그 재현 방법"
      description: "어디로 이동했는지, 어떤 작업을 수행했는지, 어떤 오류가 발생했는지 순서대로 작성해 주세요."
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: "기대 동작"
      description: "문제가 없을 경우 어떻게 동작해야 하는지 설명해 주세요."
      value: |
        - 예상 동작:
        - 실제 동작:
    validations:
      required: true

  - type: textarea
    id: additional_info
    attributes:
      label: "추가 정보"
      description: "추가로 공유할 내용이 있다면 자유롭게 작성해 주세요."
    validations:
      required: false
